name: Ultra-Light-VPS

on:
  workflow_dispatch:
    inputs:
      vps_username:
        description: 'اسم المستخدم'
        required: true
        default: 'vpsuser'
        type: string
      vps_password:
        description: 'كلمة المرور'
        required: true
        default: 'vps123456'
        type: string

jobs:
  light-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: 🪶 تثبيت الحد الأدنى المطلق للنظام
        run: |
          # تحديث سريع وتثبيت الأدوات الحيوية فقط بدون أي زوائد
          sudo apt update -y
          sudo apt install -y curl wget git htop python3-pip jq qrencode
            
      - name: 👤 إنشاء المستخدم
        run: |
          sudo useradd -m -s /bin/bash ${{ github.event.inputs.vps_username }}
          echo "${{ github.event.inputs.vps_username }}:${{ github.event.inputs.vps_password }}" | sudo chpasswd
          sudo usermod -aG sudo ${{ github.event.inputs.vps_username }}
          
      - name: 🌐 ربط شبكة Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=ultra-vps-${{ github.run_id }} \
            --ssh
            
          echo "MAGIC_DNS=$(tailscale status --json | jq -r '.Self.DNSName')" >> $GITHUB_ENV
          echo "TAILSCALE_IP=$(tailscale ip -4)" >> $GITHUB_ENV
          
      - name: 📊 معلومات الاتصال
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                  🪶 ULTRA-LIGHT VPS READY!                   ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║                                                              ║"
          echo "║  🔗 اتصال SSH السريع:                                        ║"
          echo "║     ssh ${{ github.event.inputs.vps_username }}@${{ env.MAGIC_DNS }}                       ║"
          echo "║     أو عبر الأبّي:                                           ║"
          echo "║     ssh ${{ github.event.inputs.vps_username }}@${{ env.TAILSCALE_IP }}                    ║"
          echo "║                                                              ║"
          echo "║  🔑 كلمة المرور: ${{ github.event.inputs.vps_password }}     ║"
          echo "║                                                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          
      - name: ⏳ تشغيل دائم والمراقبة
        run: |
          echo "🚀 VPS يعمل الآن بأقل استهلاك ممكن للموارد..."
          while true; do
            sleep 120
          done

      - name: تنظيف
        if: always()
        run: |
          sudo tailscale down || true
          echo "✅ تم التنظيف"
