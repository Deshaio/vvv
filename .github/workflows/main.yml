========================================================
الملف:    main.yml (نسخة معدلة بسيطة)
التعديلات: تصحيح الأخطاء + تنظيف الكود + إضافة خيارين بسيطين
النتيجة:   ملف يعمل بدون أخطاء وبتحسينات طفيفة
========================================================
"""

---

# **الملف المعدل ببساطة – `main.yml`**

```yaml
name: Linux-Desktop-VPS
on:
  workflow_dispatch:
    inputs:
      desktop_environment:
        description: 'واجهة سطح المكتب'
        required: true
        default: 'xfce'
        type: choice
        options:
          - xfce
          - gnome
          - kde
          - cinnamon
          - mate
      vnc_password:
        description: 'كلمة مرور VNC'
        required: true
        default: 'linux@vps'
        type: string
      screen_resolution:
        description: 'دقة الشاشة'
        required: true
        default: '1920x1080'
        type: string
      # ✅ إضافة بسيطة: مدة تشغيل VPS
      vps_duration:
        description: '⏳ مدة التشغيل (ساعات، 0 = لا نهائي)'
        required: true
        default: '0'
        type: string
      # ✅ إضافة بسيطة: تثبيت أدوات إضافية
      install_extra_tools:
        description: '📦 تثبيت أدوات إضافية (اختياري)'
        required: false
        default: 'false'
        type: boolean

jobs:
  linux-desktop-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 0
    
    steps:
      - name: 🐧 تثبيت نظام لينكس كامل مع واجهة رسومية
        run: |
          # تحديث النظام
          sudo apt update -y
          sudo apt full-upgrade -y
          
          # تثبيت نظام لينكس كامل مع واجهة رسومية
          echo "📦 تثبيت نظام لينكس كامل..."
          
          # تثبيت حزم أساسية
          sudo apt install -y ubuntu-desktop-minimal \
            tasksel \
            software-properties-common \
            apt-transport-https \
            wget \
            curl \
            git \
            net-tools \
            build-essential \
            qrencode   # ✅ إضافة بسيطة: لتوليد QR Code
            
          # تثبيت واجهة سطح مكتب حسب الاختيار
          case "${{ github.event.inputs.desktop_environment }}" in
            "xfce")
              sudo apt install -y xfce4 xfce4-goodies
              echo "✅ تم تثبيت XFCE"
              ;;
            "gnome")
              sudo apt install -y gnome-shell gnome-terminal gnome-tweaks
              echo "✅ تم تثبيت GNOME"
              ;;
            "kde")
              sudo apt install -y kde-plasma-desktop
              echo "✅ تم تثبيت KDE"
              ;;
            "cinnamon")
              sudo apt install -y cinnamon-desktop-environment
              echo "✅ تم تثبيت Cinnamon"
              ;;
            "mate")
              sudo apt install -y mate-desktop-environment
              echo "✅ تم تثبيت MATE"
              ;;
          esac
          
          # تثبيت تطبيقات أساسية
          echo "📦 تثبيت التطبيقات الأساسية..."
          sudo apt install -y \
            firefox \
            chromium-browser \
            vlc \
            gimp \
            libreoffice \
            filezilla \
            remmina \
            thunderbird \
            transmission \
            gnome-system-monitor \
            htop \
            neofetch \
            guake \
            terminator
            
      - name: 🖥️ تكوين VNC للوصول عن بعد
        run: |
          # تثبيت خادم VNC
          sudo apt install -y tightvncserver x11vnc novnc websockify
          
          # إنشاء كلمة مرور VNC
          mkdir -p ~/.vnc
          echo "${{ github.event.inputs.vnc_password }}" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          
          # إنشاء سكريبت تشغيل VNC
          cat > ~/start-vnc.sh << 'EOF'
          #!/bin/bash
          # إعداد دقة الشاشة
          SCREEN_RES="${{ github.event.inputs.screen_resolution }}"
          DEPTH="24"
          
          # إيقاف أي جلسة VNC قائمة
          vncserver -kill :1 2>/dev/null
          
          # بدء جلسة VNC جديدة
          vncserver :1 \
            -geometry ${SCREEN_RES} \
            -depth ${DEPTH} \
            -localhost no \
            -SecurityTypes None \
            -AlwaysShared \
            -AcceptKeyEvents \
            -AcceptPointerEvents \
            -AcceptSetDesktopSize \
            -SendCutText \
            -AcceptCutText
          
          # بدء noVNC للوصول عبر المتصفح
          websockify -D --web=/usr/share/novnc/ 8080 localhost:5901
          
          echo "✅ VNC Server running on port 5901"
          echo "🌐 Web VNC accessible at: http://localhost:8080/vnc.html"
          EOF
          
          chmod +x ~/start-vnc.sh
          
      - name: 🌐 تثبيت وتكوين Tailscale
        run: |
          # تثبيت Tailscale
          curl -fsSL https://tailscale.com/install.sh | sh
          
          # تشغيل Tailscale
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=linux-desktop-${{ github.run_id }} \
            --ssh \
            --accept-routes
            
          # جلب معلومات IP
          TAILSCALE_IP=$(tailscale ip -4)
          MAGIC_DNS=$(tailscale status --json | jq -r '.Self.DNSName')
          
          echo "TAILSCALE_IP=$TAILSCALE_IP" >> $GITHUB_ENV
          echo "MAGIC_DNS=$MAGIC_DNS" >> $GITHUB_ENV
          
      - name: 🚀 بدء خدمات النظام
        run: |
          # تمكين واجهة المستخدم الرسومية
          sudo systemctl set-default graphical.target
          
          # إنشاء ملف تكوين لـ LightDM (مدير العرض)
          sudo mkdir -p /etc/lightdm/lightdm.conf.d
          sudo cat > /etc/lightdm/lightdm.conf.d/50-autologin.conf << EOF
          [SeatDefaults]
          autologin-user=$USER
          autologin-session=${{ github.event.inputs.desktop_environment }}
          EOF
          
          # بدء خدمات العرض
          sudo systemctl start lightdm || true
          sudo systemctl enable lightdm || true
          
          # بدء VNC
          ./start-vnc.sh &
          
      - name: 🔧 تكوينات إضافية للينكس
        run: |
          # تثبيت محركات ألعاب
          sudo apt install -y \
            steam-installer \
            lutris \
            playonlinux \
            wine-stable
            
          # تثبيت أدوات المطورين
          sudo apt install -y \
            code \
            python3-pip \
            nodejs \
            npm \
            golang \
            openjdk-17-jdk \
            php \
            mysql-server \
            postgresql \
            docker.io \
            docker-compose
            
          # ✅ إضافة شرط تثبيت الأدوات الإضافية
          if [ "${{ github.event.inputs.install_extra_tools }}" == "true" ]; then
            echo "📦 تثبيت أدوات إضافية..."
            sudo apt install -y \
              nmap \
              wireshark \
              sqlmap \
              hydra \
              john \
              aircrack-ng
          fi
          
          # إنشاء مستخدم افتراضي
          sudo useradd -m -s /bin/bash vpsuser 2>/dev/null || true
          echo "vpsuser:linux123" | sudo chpasswd
          sudo usermod -aG sudo vpsuser
          
          # إعدادات مخصصة
          echo "export EDITOR=nano" >> ~/.bashrc
          echo "alias ll='ls -la'" >> ~/.bashrc
          echo "alias update='sudo apt update && sudo apt upgrade -y'" >> ~/.bashrc
          
      - name: 🎮 تثبيت ألعاب وتطبيقات ترفيهية
        run: |
          # تثبيت ألعاب
          sudo apt install -y \
            supertuxkart \
            0ad \
            extremetuxracer \
            frozen-bubble \
            gnome-chess \
            lbreakout2
            
          # تثبيت تطبيقات وسائط
          sudo apt install -y \
            spotify-client \
            obs-studio \
            audacity \
            kdenlive \
            handbrake
            
          # تثبيت أدوات الإنتاجية (باستخدام snap)
          sudo snap install slack --classic || true
          sudo snap install discord || true
          sudo snap install zoom-client || true
          
      - name: 🛡️ تأمين النظام
        run: |
          # جدار الحماية
          sudo apt install -y ufw
          sudo ufw allow 22
          sudo ufw allow 5901  # VNC
          sudo ufw allow 8080  # noVNC
          sudo ufw --force enable
          
          # Fail2ban
          sudo apt install -y fail2ban
          sudo systemctl enable fail2ban || true
          sudo systemctl start fail2ban || true
          
          # تحديث النظام الأمني
          sudo apt install -y unattended-upgrades
          sudo unattended-upgrades --enable || true
          
      - name: 📡 إنشاء لوحة تحكم ويب
        run: |
          # تثبيت Apache + PHP
          sudo apt install -y apache2 php libapache2-mod-php php-mysql
          
          # إنشاء لوحة تحكم بسيطة
          sudo cat > /var/www/html/dashboard.php << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Linux VPS Dashboard</title>
              <style>
                  body { font-family: Arial; background: #1a1a1a; color: white; }
                  .container { max-width: 1200px; margin: auto; padding: 20px; }
                  .card { background: #2d2d2d; padding: 20px; margin: 10px; border-radius: 10px; }
                  .btn { background: #4CAF50; color: white; padding: 10px; border: none; cursor: pointer; }
                  .status { color: #4CAF50; }
                  .warning { color: #ff9800; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🐧 Linux VPS Dashboard</h1>
                  
                  <div class="card">
                      <h2>System Status</h2>
                      <pre><?php system('neofetch --stdout'); ?></pre>
                  </div>
                  
                  <div class="card">
                      <h2>Quick Access</h2>
                      <button class="btn" onclick="window.open('http://localhost:8080/vnc.html', '_blank')">
                          🖥️ Launch VNC Desktop
                      </button>
                      <button class="btn" onclick="window.open('http://localhost/phpmyadmin', '_blank')">
                          🗄️ PHPMyAdmin
                      </button>
                  </div>
                  
                  <div class="card">
                      <h2>System Info</h2>
                      <pre>
      CPU: <?php system('lscpu | grep "Model name" | cut -d: -f2'); ?>
      RAM: <?php system('free -h | grep Mem | awk "{print \$2}"'); ?>
      Disk: <?php system('df -h / | tail -1 | awk "{print \$2}"'); ?>
      Uptime: <?php system('uptime -p'); ?>
                      </pre>
                  </div>
              </div>
          </body>
          </html>
          EOF
          
          sudo systemctl restart apache2 || true
          
      - name: 📊 عرض معلومات الاتصال
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                🎉 LINUX DESKTOP VPS READY!                   ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║                                                              ║"
          echo "║  🐧 نظام التشغيل: Ubuntu Desktop                            ║"
          echo "║  🖥️  واجهة المستخدم: ${{ github.event.inputs.desktop_environment }}                 ║"
          echo "║  📺 دقة الشاشة: ${{ github.event.inputs.screen_resolution }}                      ║"
          echo "║                                                              ║"
          echo "║  🔗 طرق الاتصال:                                            ║"
          echo "║                                                              ║"
          echo "║  1. 📡 عبر Tailscale SSH:                                   ║"
          echo "║     ssh $USER@${{ env.MAGIC_DNS }}                           ║"
          echo "║                                                              ║"
          echo "║  2. 🖥️  VNC Desktop (مباشر):                                ║"
          echo "║     عنوان: ${{ env.TAILSCALE_IP }}:5901                      ║"
          echo "║     كلمة المرور: ${{ github.event.inputs.vnc_password }}     ║"
          echo "║                                                              ║"
          echo "║  3. 🌐 Web VNC (من المتصفح):                                ║"
          echo "║     http://${{ env.TAILSCALE_IP }}:8080/vnc.html             ║"
          echo "║                                                              ║"
          echo "║  4. 🕸️  Web Dashboard:                                      ║"
          echo "║     http://${{ env.TAILSCALE_IP }}/dashboard.php             ║"
          echo "║                                                              ║"
          echo "║  👤 بيانات الدخول:                                          ║"
          echo "║     اسم المستخدم: vpsuser                                   ║"
          echo "║     كلمة المرور: linux123                                   ║"
          echo "║                                                              ║"
          echo "║  📦 التطبيقات المثبتة:                                      ║"
          echo "║     • Firefox, Chrome                                       ║"
          echo "║     • LibreOffice                                           ║"
          echo "║     • VLC Media Player                                      ║"
          echo "║     • GIMP, Steam, Discord                                  ║"
          echo "║     • VS Code, Docker, MySQL                                ║"
          echo "║                                                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          
          # توليد QR Code
          if command -v qrencode &> /dev/null; then
            echo "http://${{ env.TAILSCALE_IP }}:8080/vnc.html" | qrencode -t ansiutf8
          fi
          
      - name: ⏳ إبقاء النظام شغالاً
        run: |
          echo "🚀 Linux Desktop VPS is running..."
          echo "🖥️  Desktop Environment: ${{ github.event.inputs.desktop_environment }}"
          echo "🔗 Access via: http://${{ env.TAILSCALE_IP }}:8080/vnc.html"
          echo ""
          echo "📊 System monitoring started..."
          
          # الحصول على المدة المحددة
          DURATION="${{ github.event.inputs.vps_duration }}"
          
          if [ "$DURATION" -eq 0 ] 2>/dev/null; then
            echo "♾️ تشغيل VPS لأجل غير مسمى..."
            
            # نظام مراقبة
            while true; do
              echo ""
              echo "[$(date +'%Y-%m-%d %H:%M:%S')] === System Status ==="
              echo "👥 Active Users: $(who | wc -l)"
              echo "💾 Memory: $(free -m | awk 'NR==2{printf "%.1f%%", $3*100/$2}')"
              echo "🔥 CPU Load: $(uptime | awk -F'load average:' '{print $2}')"
              echo "📡 VNC Connections: $(netstat -an 2>/dev/null | grep :5901 | grep ESTABLISHED | wc -l)"
              
              # إعادة تشغيل VNC إذا توقف
              if ! pgrep -x "Xvnc" > /dev/null; then
                echo "⚠️  VNC stopped, restarting..."
                ./start-vnc.sh &
              fi
              
              sleep 60
            done
          else
            echo "⏱️ تشغيل الخادم لمدة $DURATION ساعة..."
            SECONDS=$((DURATION * 3600))
            
            for ((i=1; i<=SECONDS/60; i++)); do
              echo "[$(date +'%Y-%m-%d %H:%M:%S')] VPS يعمل - الدقيقة $i/$((SECONDS/60))"
              sleep 60
            done
            
            echo "⏰ انتهت المدة الزمنية المحددة"
          fi

      - name: 🧹 تنظيف قبل الإغلاق
        if: always()
        run: |
          echo "🧹 تنظيف الخادم..."
          # إزالة المفاتيح المؤقتة
          rm -f /tmp/vps_key /tmp/vps_key.pub 2>/dev/null || true
          # إيقاف Tailscale
          sudo tailscale down 2>/dev/null || true
          echo "✅ تم التنظيف"
