name: ULTRA-VPS-PRO
on:
  workflow_dispatch:
    inputs:
      desktop_environment:
        description: '🖥️ واجهة سطح المكتب'
        required: true
        default: 'xfce'
        type: choice
        options:
          - xfce
          - gnome
          - kde
          - cinnamon
          - mate
          - lxqt
      vnc_password:
        description: '🔑 كلمة مرور VNC'
        required: true
        default: 'Ultra@VPS#2099'
        type: string
      screen_resolution:
        description: '📺 دقة الشاشة'
        required: true
        default: '1920x1080'
        type: string
      vps_duration:
        description: '⏳ مدة تشغيل VPS (ساعات) - 0 للانهائي'
        required: true
        default: '0'
        type: string
      enable_hacking_tools:
        description: '🔧 تثبيت أدوات الاختراق'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      enable_persistence:
        description: '🔄 تفعيل الاستمرارية (إعادة تشغيل تلقائي)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      enable_ai_assistant:
        description: '🤖 تفعيل المساعد الذكي (AI)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      enable_ngrok:
        description: '🌐 تفعيل Ngrok للوصول الخارجي'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      enable_vpn:
        description: '🔒 تفعيل VPN مدمج'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  ultra-vps-pro:
    runs-on: ubuntu-latest
    timeout-minutes: 0
    permissions:
      contents: write
      packages: write
    
    steps:
      # ============================================================
      # 1. التحضير والتحديث
      # ============================================================
      - name: 🚀 تجهيز النظام الأساسي
        run: |
          echo "🔥 بدء تشغيل ULTRA-VPS-PRO v2.0..."
          echo "🕒 الوقت: $(date)"
          echo "🔄 تحديث النظام..."
          sudo apt update -y && sudo apt full-upgrade -y
          sudo apt install -y software-properties-common apt-transport-https \
            wget curl git net-tools build-essential \
            gnupg2 ca-certificates lsb-release

      # ============================================================
      # 2. تثبيت النواة والتحسينات
      # ============================================================
      - name: ⚡ تحسين النواة والأداء
        run: |
          echo "⚡ تطبيق تحسينات النواة..."
          sudo cat > /etc/sysctl.d/99-performance.conf << 'EOF'
          # أداء الشبكة
          net.core.rmem_max = 134217728
          net.core.wmem_max = 134217728
          net.ipv4.tcp_rmem = 4096 87380 134217728
          net.ipv4.tcp_wmem = 4096 65536 134217728
          net.ipv4.tcp_congestion_control = bbr
          net.core.default_qdisc = fq
          
          # أداء النظام
          kernel.numa_balancing = 0
          vm.swappiness = 10
          vm.vfs_cache_pressure = 50
          vm.dirty_ratio = 30
          vm.dirty_background_ratio = 5
          EOF
          sudo sysctl -p

      # ============================================================
      # 3. تثبيت سطح المكتب الكامل
      # ============================================================
      - name: 🖥️ تثبيت سطح المكتب والتطبيقات
        run: |
          echo "📦 تثبيت النظام الكامل..."
          
          # تثبيت الحزم الأساسية
          sudo apt install -y ubuntu-desktop-minimal \
            tasksel \
            xorg \
            xinit \
            x11-utils \
            x11-xserver-utils
            
          # واجهة سطح المكتب حسب الاختيار
          case "${{ github.event.inputs.desktop_environment }}" in
            "xfce")
              sudo apt install -y xfce4 xfce4-goodies \
                thunar-archive-plugin xfce4-whiskermenu-plugin
              echo "✅ XFCE"
              ;;
            "gnome")
              sudo apt install -y gnome-shell gnome-terminal \
                gnome-tweaks gnome-shell-extensions
              echo "✅ GNOME"
              ;;
            "kde")
              sudo apt install -y kde-plasma-desktop \
                plasma-workspace konsole dolphin
              echo "✅ KDE"
              ;;
            "cinnamon")
              sudo apt install -y cinnamon-desktop-environment \
                cinnamon-screensaver
              echo "✅ Cinnamon"
              ;;
            "mate")
              sudo apt install -y mate-desktop-environment \
                mate-terminal caja
              echo "✅ MATE"
              ;;
            "lxqt")
              sudo apt install -y lxqt lxqt-config qterminal
              echo "✅ LXQt"
              ;;
          esac
          
          # تطبيقات أساسية
          sudo apt install -y \
            firefox chromium-browser \
            vlc mpv \
            gimp inkscape \
            libreoffice \
            filezilla \
            remmina \
            thunderbird \
            transmission \
            gnome-system-monitor \
            htop btop \
            neofetch \
            guake terminator \
            tilix \
            telegram-desktop \
            discord \
            slack \
            zoom \
            obs-studio \
            kdenlive \
            audacity \
            handbrake

      # ============================================================
      # 4. تثبيت أدوات الاختراق (اختياري)
      # ============================================================
      - name: 🔧 تثبيت أدوات الاختراق والأمان
        if: github.event.inputs.enable_hacking_tools == 'true'
        run: |
          echo "🔧 تثبيت أدوات الاختراق..."
          
          # أدوات الشبكة
          sudo apt install -y \
            nmap \
            wireshark \
            tcpdump \
            netcat-openbsd \
            socat \
            masscan \
            nikto \
            sqlmap \
            hydra \
            john \
            aircrack-ng \
            reaver \
            bully
            
          # أدوات الاختراق المتقدمة
          sudo apt install -y \
            metasploit-framework \
            burpsuite \
            zaproxy \
            wpscan \
            dirb \
            gobuster \
            feroxbuster
          
          # أدوات Python للأمان
          pip3 install --upgrade pip
          pip3 install \
            requests \
            beautifulsoup4 \
            scapy \
            paramiko \
            pymongo \
            psycopg2-binary \
            redis \
            pyrogram \
            flask \
            flask-cors \
            websocket-client \
            termcolor \
            colorama \
            pyfiglet \
            shodan \
            censys \
            python-nmap \
            impacket \
            pwntools \
            binwalk \
            steghide \
            exiftool
            
          # تثبيت أدوات إضافية
          git clone https://github.com/trustedsec/social-engineer-toolkit.git /opt/set
          git clone https://github.com/beefproject/beef.git /opt/beef
          git clone https://github.com/lanmaster53/recon-ng.git /opt/recon-ng
          git clone https://github.com/laramies/theHarvester.git /opt/theHarvester
          
          echo "✅ تم تثبيت جميع أدوات الاختراق"

      # ============================================================
      # 5. تثبيت VNC و noVNC
      # ============================================================
      - name: 🖥️ تكوين VNC مع noVNC متقدم
        run: |
          echo "🖥️ تثبيت وتكوين VNC..."
          
          # تثبيت خوادم VNC
          sudo apt install -y \
            tightvncserver \
            x11vnc \
            novnc \
            websockify \
            tigervnc-standalone-server
            
          # إنشاء كلمة مرور VNC
          mkdir -p ~/.vnc
          echo "${{ github.event.inputs.vnc_password }}" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          
          # إنشاء ملف بدء تشغيل VNC
          cat > ~/start-vnc.sh << 'EOF'
          #!/bin/bash
          SCREEN_RES="${{ github.event.inputs.screen_resolution }}"
          DEPTH="24"
          GEOMETRY="${SCREEN_RES/x/ }"
          
          vncserver -kill :1 2>/dev/null
          vncserver -kill :2 2>/dev/null
          
          # بدء VNC على المنفذ 5901
          vncserver :1 \
            -geometry ${GEOMETRY} \
            -depth ${DEPTH} \
            -localhost no \
            -SecurityTypes None \
            -AlwaysShared \
            -AcceptKeyEvents \
            -AcceptPointerEvents \
            -AcceptSetDesktopSize \
            -SendCutText \
            -AcceptCutText
          
          # بدء noVNC على المنفذ 8080
          websockify -D --web=/usr/share/novnc/ 8080 localhost:5901
          
          # بدء VNC إضافي على المنفذ 5902 (اختياري)
          vncserver :2 \
            -geometry 1280x720 \
            -depth 16 \
            -localhost no \
            -SecurityTypes None \
            -AlwaysShared
          
          websockify -D --web=/usr/share/novnc/ 8081 localhost:5902
          
          echo "✅ VNC Servers Running on ports 5901, 5902"
          echo "🌐 Web VNC: http://localhost:8080/vnc.html and http://localhost:8081/vnc.html"
          EOF
          
          chmod +x ~/start-vnc.sh

      # ============================================================
      # 6. تشغيل واجهة سطح المكتب تلقائياً
      # ============================================================
      - name: 🚀 تشغيل سطح المكتب
        run: |
          echo "🚀 تشغيل سطح المكتب..."
          
          # تعيين الهدف الرسومي
          sudo systemctl set-default graphical.target
          
          # تكوين LightDM للتسجيل التلقائي
          sudo mkdir -p /etc/lightdm/lightdm.conf.d
          sudo cat > /etc/lightdm/lightdm.conf.d/50-autologin.conf << EOF
          [SeatDefaults]
          autologin-user=$USER
          autologin-session=${{ github.event.inputs.desktop_environment }}
          EOF
          
          # بدء LightDM
          sudo systemctl start lightdm || true
          sudo systemctl enable lightdm || true
          
          # بدء VNC في الخلفية
          nohup ./start-vnc.sh > /dev/null 2>&1 &
          
          echo "✅ تم تشغيل سطح المكتب و VNC"

      # ============================================================
      # 7. تثبيت Ngrok للوصول الخارجي
      # ============================================================
      - name: 🌐 تثبيت وتكوين Ngrok
        if: github.event.inputs.enable_ngrok == 'true'
        run: |
          echo "🌐 تثبيت Ngrok..."
          
          wget -O ngrok.tgz https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-linux-amd64.tgz
          tar xzf ngrok.tgz
          sudo mv ngrok /usr/local/bin/
          rm ngrok.tgz
          
          # إضافة التوكن (من أسرار GitHub)
          if [ -n "${{ secrets.NGROK_AUTH_TOKEN }}" ]; then
            ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          else
            echo "⚠️ لم يتم تعيين NGROK_AUTH_TOKEN"
          fi
          
          # تشغيل Ngrok في الخلفية
          nohup ngrok http 8080 > /tmp/ngrok.log 2>&1 &
          sleep 5
          
          # استخراج رابط Ngrok
          NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url' 2>/dev/null || echo "غير متاح")
          echo "NGROK_URL=$NGROK_URL" >> $GITHUB_ENV
          echo "✅ Ngrok URL: $NGROK_URL"

      # ============================================================
      # 8. تثبيت Tailscale VPN
      # ============================================================
      - name: 🔒 تثبيت وتكوين Tailscale
        if: github.event.inputs.enable_vpn == 'true'
        run: |
          echo "🔒 تثبيت Tailscale VPN..."
          
          curl -fsSL https://tailscale.com/install.sh | sh
          
          if [ -n "${{ secrets.TAILSCALE_AUTH_KEY }}" ]; then
            sudo tailscale up \
              --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
              --hostname=ultra-vps-${{ github.run_id }} \
              --ssh \
              --accept-routes \
              --advertise-tags=tag:dev
          else
            echo "⚠️ لم يتم تعيين TAILSCALE_AUTH_KEY"
          fi
          
          TAILSCALE_IP=$(tailscale ip -4 2>/dev/null || echo "غير متاح")
          MAGIC_DNS=$(tailscale status --json 2>/dev/null | jq -r '.Self.DNSName' 2>/dev/null || echo "غير متاح")
          
          echo "TAILSCALE_IP=$TAILSCALE_IP" >> $GITHUB_ENV
          echo "MAGIC_DNS=$MAGIC_DNS" >> $GITHUB_ENV
          echo "✅ Tailscale IP: $TAILSCALE_IP"

      # ============================================================
      # 9. تثبيت المساعد الذكي (AI)
      # ============================================================
      - name: 🤖 تثبيت المساعد الذكي
        if: github.event.inputs.enable_ai_assistant == 'true'
        run: |
          echo "🤖 تثبيت المساعد الذكي..."
          
          # تثبيت Ollama (LLM محلي)
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /dev/null 2>&1 &
          sleep 5
          ollama pull llama3.2:3b
          
          # تثبيت مساعد Python
          pip3 install openai python-dotenv
          
          # إنشاء ملف المساعد
          cat > ~/ai_assistant.py << 'EOF'
          #!/usr/bin/env python3
          import subprocess
          import json
          import os
          
          def ai_response(prompt):
              try:
                  result = subprocess.run(
                      ['ollama', 'run', 'llama3.2:3b', prompt],
                      capture_output=True,
                      text=True,
                      timeout=30
                  )
                  return result.stdout
              except:
                  return "AI غير متاح حالياً"
          
          if __name__ == "__main__":
              print("🤖 مساعد الذكي جاهز (اكتب 'exit' للخروج)")
              while True:
                  user_input = input("> ")
                  if user_input.lower() == "exit":
                      break
                  response = ai_response(user_input)
                  print(response)
          EOF
          
          chmod +x ~/ai_assistant.py
          echo "✅ تم تثبيت المساعد الذكي"

      # ============================================================
      # 10. الاستمرارية (Persistence)
      # ============================================================
      - name: 🔄 تفعيل الاستمرارية التلقائية
        if: github.event.inputs.enable_persistence == 'true'
        run: |
          echo "🔄 تفعيل الاستمرارية..."
          
          # إنشاء خدمة systemd
          sudo cat > /etc/systemd/system/ultra-vps.service << 'EOF'
          [Unit]
          Description=Ultra VPS Persistence Service
          After=network.target
          
          [Service]
          Type=simple
          ExecStart=/usr/bin/bash /home/runner/start-vnc.sh
          Restart=always
          RestartSec=10
          User=runner
          
          [Install]
          WantedBy=multi-user.target
          EOF
          
          sudo systemctl daemon-reload
          sudo systemctl enable ultra-vps.service
          sudo systemctl start ultra-vps.service
          
          # إضافة إلى crontab
          (crontab -l 2>/dev/null; echo "@reboot /home/runner/start-vnc.sh") | crontab -
          
          echo "✅ تم تفعيل الاستمرارية"

      # ============================================================
      # 11. إنشاء لوحة تحكم متقدمة
      # ============================================================
      - name: 🕸️ إنشاء لوحة تحكم ويب
        run: |
          echo "🕸️ إنشاء لوحة تحكم ويب متقدمة..."
          
          sudo apt install -y apache2 php libapache2-mod-php php-mysql php-curl php-json php-xml php-zip
          
          sudo cat > /var/www/html/dashboard.php << 'EOF'
          <!DOCTYPE html>
          <html lang="ar">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>ULTRA VPS PRO - Dashboard</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0a0a0a; color: #fff; }
                  .container { max-width: 1400px; margin: auto; padding: 20px; }
                  .header { background: linear-gradient(135deg, #00ff87, #60efff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 2.5em; text-align: center; padding: 20px 0; }
                  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
                  .card { background: #1a1a2e; border-radius: 15px; padding: 20px; border: 1px solid #333; transition: 0.3s; }
                  .card:hover { transform: translateY(-5px); border-color: #00ff87; box-shadow: 0 0 30px rgba(0,255,135,0.1); }
                  .card h3 { color: #00ff87; margin-bottom: 15px; font-size: 1.2em; }
                  .card .value { font-size: 2em; color: #60efff; }
                  .card .label { color: #888; font-size: 0.9em; }
                  .btn { background: #00ff87; color: #000; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
                  .btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(0,255,135,0.3); }
                  .btn-danger { background: #ff0055; color: #fff; }
                  .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8em; }
                  .status-online { background: #00ff87; color: #000; }
                  .status-offline { background: #ff0055; color: #fff; }
                  pre { background: #111; padding: 15px; border-radius: 10px; overflow-x: auto; font-size: 0.8em; }
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="header">🔥 ULTRA VPS PRO v2.0</div>
                  
                  <div style="text-align:center;margin:20px 0;">
                      <span class="status-badge status-online">🟢 نظام يعمل</span>
                      <span class="status-badge status-online">🖥️ سطح المكتب: <?php echo "${{ github.event.inputs.desktop_environment }}"; ?></span>
                  </div>
                  
                  <div class="grid">
                      <div class="card">
                          <h3>🖥️ النظام</h3>
                          <pre><?php system('neofetch --stdout 2>/dev/null'); ?></pre>
                      </div>
                      <div class="card">
                          <h3>📊 الموارد</h3>
                          <div>CPU: <span class="value"><?php system("top -bn1 | grep 'Cpu(s)' | awk '{print $2}' | cut -d. -f1"); ?>%</span></div>
                          <div>RAM: <span class="value"><?php system("free -m | awk 'NR==2{printf \"%.1f\", $3*100/$2}'"); ?>%</span></div>
                          <div>Disk: <span class="value"><?php system("df -h / | tail -1 | awk '{print $5}'"); ?></span></div>
                          <div>Uptime: <span class="value"><?php system("uptime -p | cut -d' ' -f2-"); ?></span></div>
                      </div>
                      <div class="card">
                          <h3>🔗 روابط الاتصال</h3>
                          <p><strong>Web VNC:</strong> <a href="/vnc.html" style="color:#00ff87;">http://localhost:8080/vnc.html</a></p>
                          <?php if (getenv('NGROK_URL')): ?>
                          <p><strong>Ngrok:</strong> <a href="<?php echo getenv('NGROK_URL'); ?>" style="color:#00ff87;"><?php echo getenv('NGROK_URL'); ?></a></p>
                          <?php endif; ?>
                          <?php if (getenv('TAILSCALE_IP')): ?>
                          <p><strong>Tailscale:</strong> <?php echo getenv('TAILSCALE_IP'); ?>:5901</p>
                          <p><strong>Magic DNS:</strong> <?php echo getenv('MAGIC_DNS'); ?></p>
                          <?php endif; ?>
                      </div>
                      <div class="card">
                          <h3>🛠️ أدوات سريعة</h3>
                          <button class="btn" onclick="window.open('/vnc.html','_blank')">🖥️ VNC Desktop</button>
                          <button class="btn" onclick="window.open('/phpmyadmin','_blank')">🗄️ PHPMyAdmin</button>
                          <button class="btn" onclick="window.open('/jupyter','_blank')">📓 Jupyter</button>
                          <button class="btn" onclick="window.open('/code-server','_blank')">💻 VS Code</button>
                      </div>
                      <div class="card">
                          <h3>📦 التطبيقات المثبتة</h3>
                          <pre><?php system("dpkg -l | grep -E '(firefox|chromium|vlc|gimp|libreoffice|obs-studio|kdenlive|steam|discord|code)' | awk '{print $2}' | head -10"); ?></pre>
                      </div>
                      <div class="card">
                          <h3>⚡ إحصائيات VPS</h3>
                          <div>الجلسات النشطة: <span class="value"><?php system("who | wc -l"); ?></span></div>
                          <div>اتصالات VNC: <span class="value"><?php system("netstat -an | grep :5901 | grep ESTABLISHED | wc -l"); ?></span></div>
                          <div>العمليات: <span class="value"><?php system("ps aux | wc -l"); ?></span></div>
                      </div>
                  </div>
                  
                  <div style="margin-top:30px;text-align:center;color:#666;font-size:0.8em;">
                      ULTRA-VPS-PRO v2.0 | تم إنشاؤه بواسطة المهندس المعماري © 2099
                  </div>
              </div>
          </body>
          </html>
          EOF
          
          sudo systemctl restart apache2
          echo "✅ تم إنشاء لوحة التحكم"

      # ============================================================
      # 12. تثبيت تطبيقات إضافية
      # ============================================================
      - name: 📦 تثبيت تطبيقات إضافية
        run: |
          echo "📦 تثبيت تطبيقات إضافية..."
          
          # VS Code
          wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > packages.microsoft.gpg
          sudo install -o root -g root -m 644 packages.microsoft.gpg /etc/apt/trusted.gpg.d/
          sudo sh -c 'echo "deb [arch=amd64,arm64,armhf signed-by=/etc/apt/trusted.gpg.d/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" > /etc/apt/sources.list.d/vscode.list'
          sudo apt update && sudo apt install -y code
          
          # Jupyter
          pip3 install jupyter jupyterlab
          nohup jupyter lab --ip=0.0.0.0 --port=8888 --allow-root --no-browser > /tmp/jupyter.log 2>&1 &
          
          # Docker
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          sudo usermod -aG docker $USER
          
          # Docker Compose
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      # ============================================================
      # 13. عرض معلومات الاتصال النهائية
      # ============================================================
      - name: 📡 عرض معلومات الاتصال
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║            🔥 ULTRA VPS PRO v2.0 - READY!                  ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║                                                              ║"
