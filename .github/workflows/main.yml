name: Linux-Desktop-VPS

on:
  workflow_dispatch:
    inputs:
      desktop_environment:
        description: 'واجهة سطح المكتب'
        required: true
        default: 'xfce'
        type: choice
        options:
          - xfce
          - gnome
          - kde
          - cinnamon
          - mate
      vnc_password:
        description: 'كلمة مرور VNC'
        required: true
        default: 'linux@vps'
        type: string
      screen_resolution:
        description: 'دقة الشاشة'
        required: true
        default: '1280x720'
        type: string

jobs:
  linux-desktop-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # الحد الأقصى المسموح به للتشغيل
    
    steps:
      - name: 🐧 تثبيت نظام لينكس مع واجهة رسومية خفيفة
        run: |
          sudo apt update -y
          sudo apt full-upgrade -y
          
          # تثبيت حزم أساسية خفيفة لسرعة الإقلاع
          sudo apt install -y wget curl git net-tools build-essential qrencode
            
          # تثبيت واجهة سطح مكتب حسب الاختيار (نُفضل XFCE لسرعتها وخفة مواردها)
          case "${{ github.event.inputs.desktop_environment }}" in
            "xfce")
              sudo apt install -y xfce4 xfce4-goodies
              ;;
            "gnome")
              sudo apt install -y gnome-shell gnome-terminal
              ;;
            "kde")
              sudo apt install -y kde-plasma-desktop
              ;;
            "cinnamon")
              sudo apt install -y cinnamon-desktop-environment
              ;;
            "mate")
              sudo apt install -y mate-desktop-environment
              ;;
          esac
          
          # تثبيت متصفح خفيف وأدوات أساسية
          sudo apt install -y firefox htop terminator
            
      - name: 🖥️ تكوين VNC والوصول عن بعد
        run: |
          sudo apt install -y tightvncserver x11vnc novnc websockify
          
          mkdir -p ~/.vnc
          echo "${{ github.event.inputs.vnc_password }}" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          
          cat > ~/start-vnc.sh << 'EOF'
          #!/bin/bash
          SCREEN_RES="${{ github.event.inputs.screen_resolution }}"
          DEPTH="24"
          
          vncserver -kill :1 2>/dev/null
          
          vncserver :1 \
            -geometry ${SCREEN_RES} \
            -depth ${DEPTH} \
            -localhost no \
            -SecurityTypes None \
            -AlwaysShared
          
          websockify -D --web=/usr/share/novnc/ 8080 localhost:5901
          
          echo "✅ VNC Server running on port 5901"
          echo "🌐 Web VNC accessible at: http://localhost:8080/vnc.html"
          EOF
          
          chmod +x ~/start-vnc.sh
          
      - name: 🌐 تثبيت وتكوين Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=linux-desktop-${{ github.run_id }} \
            --ssh \
            --accept-routes
            
          TAILSCALE_IP=$(tailscale ip -4)
          MAGIC_DNS=$(tailscale status --json | jq -r '.Self.DNSName')
          
          echo "TAILSCALE_IP=$TAILSCALE_IP" >> $GITHUB_ENV
          echo "MAGIC_DNS=$MAGIC_DNS" >> $GITHUB_ENV
          
      - name: 🚀 بدء خدمات النظام و VNC
        run: |
          ./start-vnc.sh &
          
      - name: 📊 عرض معلومات الاتصال
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                🎉 LINUX DESKTOP VPS READY!                   ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║                                                              ║"
          echo "║  🐧 نظام التشغيل: Ubuntu Desktop                            ║"
          echo "║  🖥️  واجهة المستخدم: ${{ github.event.inputs.desktop_environment }}                 ║"
          echo "║  📺 دقة الشاشة: ${{ github.event.inputs.screen_resolution }}                      ║"
          echo "║                                                              ║"
          echo "║  🔗 طرق الاتصال:                                            ║"
          echo "║  1. 🌐 Web VNC (من المتصفح عبر Tailscale):                  ║"
          echo "║     http://${{ env.TAILSCALE_IP }}:8080/vnc.html             ║"
          echo "║     كلمة المرور: ${{ github.event.inputs.vnc_password }}     ║"
          echo "║                                                              ║"
          echo "║  2. 📡 عبر Tailscale SSH:                                   ║"
          echo "║     ssh $USER@${{ env.MAGIC_DNS }}                           ║"
          echo "║                                                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          
          echo "http://${{ env.TAILSCALE_IP }}:8080/vnc.html" | qrencode -t ansiutf8
          
      - name: ⏳ إبقاء النظام شغالاً ومراقبة الأداء
        run: |
          echo "🚀 Linux Desktop VPS is running..."
          
          while true; do
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] VPS يعمل بشكل طبيعي..."
            echo "  💾 الذاكرة العشوائية: $(free -m | awk 'NR==2{printf "%.1f%%", $3*100/$2}')"
            echo "  🔥 تحميل المعالج: $(uptime | awk -F'load average:' '{print $2}')"
            
            # إعادة تشغيل VNC تلقائياً إذا توقف
            if ! pgrep -x "Xvnc" > /dev/null; then
              echo "⚠️  VNC توقف، يتم إعادة تشغيله..."
              ./start-vnc.sh &
            fi
            
            sleep 60
          done

      - name: تنظيف قبل الإغلاق
        if: always()
        run: |
          echo "🧹 إيقاف وتطهير النظام..."
          sudo tailscale down || true
          echo "✅ تم التنظيف بنجاح"
