      # ============================================================
      # 14. تشغيل الخادم بشكل مستمر
      # ============================================================
      - name: ⏳ تشغيل VPS بشكل مستمر
        run: |
          echo "🚀 بدء تشغيل VPS بشكل مستمر..."
          echo "🕒 الوقت الحالي: $(date)"
          
          # الحصول على المدة المحددة
          DURATION="${{ github.event.inputs.vps_duration }}"
          
          if [ "$DURATION" -eq 0 ] 2>/dev/null; then
            echo "♾️ تشغيل VPS لأجل غير مسمى..."
            
            # نظام مراقبة متقدم
            while true; do
              echo "[$(date +'%Y-%m-%d %H:%M:%S')] ⚡ ULTRA VPS PRO يعمل"
              echo "  👥 المستخدمون النشطون: $(who | wc -l)"
              echo "  📈 تحميل النظام: $(uptime | awk -F'load average:' '{print $2}')"
              echo "  🖥️ اتصالات VNC: $(netstat -an 2>/dev/null | grep :5901 | grep ESTABLISHED | wc -l)"
              echo "  💾 الذاكرة المستخدمة: $(free -m | awk 'NR==2{printf "%.1f%%", $3*100/$2}')"
              echo "  🔥 CPU: $(top -bn1 | grep 'Cpu(s)' | awk '{print $2}' | cut -d. -f1)%"
              
              # إعادة تشغيل VNC إذا توقف
              if ! pgrep -x "Xvnc" > /dev/null; then
                echo "⚠️ VNC توقف، إعادة التشغيل..."
                ./start-vnc.sh &
              fi
              
              # إعادة تشغيل Ngrok إذا توقف
              if [ "${{ github.event.inputs.enable_ngrok }}" = "true" ] && ! pgrep -x "ngrok" > /dev/null; then
                echo "⚠️ Ngrok توقف، إعادة التشغيل..."
                nohup ngrok http 8080 > /tmp/ngrok.log 2>&1 &
              fi
              
              sleep 60
            done
          else
            echo "⏱️ تشغيل VPS لمدة $DURATION ساعة..."
            SECONDS=$((DURATION * 3600))
            
            for ((i=1; i<=SECONDS/60; i++)); do
              echo "[$(date +'%Y-%m-%d %H:%M:%S')] VPS يعمل - الدقيقة $i/$((SECONDS/60))"
              sleep 60
            done
            
            echo "⏰ انتهت المدة الزمنية المحددة"
          fi

      # ============================================================
      # 15. تنظيف ما قبل الإغلاق
      # ============================================================
      - name: 🧹 تنظيف الخادم
        if: always()
        run: |
          echo "🧹 تنظيف الخادم قبل الإغلاق..."
          
          # حذف المفاتيح المؤقتة
          rm -f /tmp/vps_key /tmp/vps_key.pub 2>/dev/null
          
          # إيقاف Tailscale
          sudo tailscale down 2>/dev/null || true
          
          # إيقاف Ngrok
          pkill -x ngrok 2>/dev/null || true
          
          echo "✅ تم التنظيف بنجاح"
